name: Build Nightly APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'shared/**'
      - 'extensions/**'
      - 'pi-bridge/**'
      - 'packages/extension-api/**'
      - 'third_party/termux/terminal-emulator/**'
      - 'third_party/termux/terminal-view/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/build-nightly-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: pi-bridge/package-lock.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced
          cache-read-only: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Prepare Nightly Metadata
        id: nightly
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::12}"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "version_name=Nightly $short_sha" >> "$GITHUB_OUTPUT"

      - name: Restore Nightly Signing Key
        shell: bash
        env:
          NIGHTLY_KEYSTORE_BASE64: ${{ secrets.NIGHTLY_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/aether-signing"
          if [ -z "$NIGHTLY_KEYSTORE_BASE64" ]; then
            echo "::warning::NIGHTLY_KEYSTORE_BASE64 is not set; Nightly APK will fall back to debug signing."
            echo "NIGHTLY_SIGNING_MISSING=1" >> "$GITHUB_ENV"
          else
            echo "$NIGHTLY_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aether-signing/aether-nightly.jks"
          fi

      - name: Build Nightly APK
        shell: bash
        env:
          NIGHTLY_SIGNING_MISSING: ${{ env.NIGHTLY_SIGNING_MISSING }}
          NIGHTLY_KEYSTORE_FILE: ${{ runner.temp }}/aether-signing/aether-nightly.jks
          NIGHTLY_KEYSTORE_PASSWORD: ${{ secrets.NIGHTLY_KEYSTORE_PASSWORD }}
          NIGHTLY_KEY_ALIAS: ${{ secrets.NIGHTLY_KEY_ALIAS }}
          NIGHTLY_KEY_PASSWORD: ${{ secrets.NIGHTLY_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.nightly.outputs.version_name }}
        run: |
          set -o pipefail
          if [ "$NIGHTLY_SIGNING_MISSING" = "1" ]; then
            echo "::warning::Building Nightly APK with debug signing (no release keystore configured on this repo)."
            env -u NIGHTLY_KEYSTORE_FILE -u NIGHTLY_KEYSTORE_PASSWORD -u NIGHTLY_KEY_ALIAS -u NIGHTLY_KEY_PASSWORD \
              ./gradlew :app:assembleNightly --stacktrace -Paether.versionName="$VERSION_NAME"
          else
            ./gradlew :app:assembleNightly --stacktrace -Paether.versionName="$VERSION_NAME"
          fi
          status=$?
          if [ "$status" -ne 0 ]; then
            ./gradlew :app:assembleNightly -Paether.versionName="$VERSION_NAME" --console=plain 2>&1 \
              | grep -E "^e: |^error: |Unresolved reference" | head -40 \
              | while IFS= read -r line; do echo "::error::${line:0:450}"; done || true
          fi
          exit $status

      - name: Rename Nightly APK
        shell: bash
        env:
          SHORT_SHA: ${{ steps.nightly.outputs.short_sha }}
        run: |
          mkdir -p dist/nightly
          cp app/build/outputs/apk/nightly/app-nightly.apk "dist/nightly/Aether-nightly-${SHORT_SHA}.apk"

      - name: Upload Nightly APK
        uses: actions/upload-artifact@v7
        with:
          name: Aether-nightly
          path: dist/nightly/*.apk
